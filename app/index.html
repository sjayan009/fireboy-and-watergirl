<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fireboy &amp; Watergirl</title>
    <!--
      Indexed: the bare address is the landing page, and this is what a search
      result says about it. The game's extracted art is kept out of search by
      robots.txt instead.
    -->
    <meta name="description" content="Fireboy &amp; Watergirl in the Forest Temple: play as two on one computer, or online with a friend." />
    <meta name="color-scheme" content="dark" />
    <!--
      The paired glyph, on its own tile. SVG where it is supported, and two
      PNGs for the places it is not: Safari's tab, and the icon iOS uses when
      somebody keeps this on a home screen.
    -->
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
