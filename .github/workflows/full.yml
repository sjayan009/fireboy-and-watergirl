# Expensive local, browser, and database coverage, twice weekly and on demand.
#
# The slow half: all 32 levels rendered and compared, the determinism soak, the
# full netcode matrix, three browser engines, the database under load, and the
# two-account end-to-end tests. Each run uses about 40 aggregate runner minutes;
# daily scheduling consumed too much of a private repository's included quota.
#
# This one holds credentials. They are repo secrets, masked in logs, and
# unavailable to pull requests from forks -- and the key stored here should be
# one minted for CI, not one that has ever been anywhere else.
#
# Every credentialed job runs from `main` only, and that is no longer only this
# file's say-so: the database password and the secret key come from the
# `ci-credentials` broker (supabase/functions/ci-credentials), which checks the
# job's GitHub-signed OIDC token for `refs/heads/main` and this workflow file. The gates used to admit
# `net/realtime-hardening` as well, so it could be validated before merging,
# and that meant whatever that branch pushed ran `db:migrate` as `postgres`
# against production with no review. A workflow is read from the branch it is
# dispatched on, so the gate is only as strong as the branches allowed through it.
#
# ## Why it is several jobs and not one command
#
# It was `npm run test:all`, which is `&&` all the way along -- so the first
# failure ended the run and everything after it was simply not attempted. A
# stale golden-render baseline therefore also cancelled the mouse tests, the
# cross-engine tests, the live database suite and every application browser
# test, and did so every night: a red job with one known cause, hiding whatever
# else had broken behind it.
#
# The stages that do not depend on each other are separate jobs now. One of them
# failing still fails the run; it no longer erases the others' results.
name: full

on:
  schedule:
    - cron: "23 4 * * 2,5"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The migration runs once, before anything that reads the schema, and holds
  # the shared concurrency group while it does. `deployed` is in the same group.
  schema:
    if: (github.event.repository.private == false || vars.FBWG_ZERO_DOLLAR_ACTIONS == '1') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write   # the OIDC token the ci-credentials broker checks
    concurrency:
      group: fbwg-database
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: credentials from the broker, which checks this is main
        uses: ./.github/actions/ci-credentials
        with:
          supabase-url: ${{ secrets.SUPABASE_URL }}
          scopes: db
      - name: write the environment the scripts read
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          umask 077
          {
            echo "SUPABASE_DB_PASSWORD=$SUPABASE_DB_PASSWORD"
            echo "SUPABASE_PROJECT_REF=$SUPABASE_PROJECT_REF"
          } > .env.local
      # It refuses to re-run a file it has already applied, and now also refuses
      # to skip one that has been EDITED since it ran -- so on almost every
      # night this prints a column of skips and costs a second.
      - name: the database is the schema the tests expect
        run: npm run db:migrate
      - if: always()
        run: rm -f .env.local

  engine:
    if: (github.event.repository.private == false || vars.FBWG_ZERO_DOLLAR_ACTIONS == '1') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      # No credentials at all: none of this touches the network.
      - name: the whole engine, including the soak and the goldens
        run: npm --prefix engine run test:full

  database:
    if: (github.event.repository.private == false || vars.FBWG_ZERO_DOLLAR_ACTIONS == '1') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: schema
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write   # the OIDC token the ci-credentials broker checks
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: credentials from the broker, which checks this is main
        uses: ./.github/actions/ci-credentials
        with:
          supabase-url: ${{ secrets.SUPABASE_URL }}
          scopes: db api
      - name: write the environment the test scripts read
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          umask 077
          {
            echo "SUPABASE_URL=$SUPABASE_URL"
            echo "SUPABASE_PUBLISHABLE_KEY=$SUPABASE_PUBLISHABLE_KEY"
            echo "SUPABASE_SECRET_KEY=$SUPABASE_SECRET_KEY"
            echo "SUPABASE_DB_PASSWORD=$SUPABASE_DB_PASSWORD"
            echo "SUPABASE_PROJECT_REF=$SUPABASE_PROJECT_REF"
          } > .env.local
      - name: row level security, the assurance matrix, and the load tests
        run: npm run db:test
      - if: always()
        run: rm -f .env.local

  application:
    if: (github.event.repository.private == false || vars.FBWG_ZERO_DOLLAR_ACTIONS == '1') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: schema
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write   # the OIDC token the ci-credentials broker checks
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: credentials from the broker, which checks this is main
        uses: ./.github/actions/ci-credentials
        with:
          supabase-url: ${{ secrets.SUPABASE_URL }}
          scopes: api
      - name: write the environment the test scripts read
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          umask 077
          {
            echo "SUPABASE_URL=$SUPABASE_URL"
            echo "SUPABASE_PUBLISHABLE_KEY=$SUPABASE_PUBLISHABLE_KEY"
            echo "SUPABASE_SECRET_KEY=$SUPABASE_SECRET_KEY"
          } > .env.local
      - name: build it as it ships
        run: npm run build && npm run check
      - name: and drive it in three browsers, with two accounts
        run: |
          set -o pipefail
          npm run app:test 2>&1 | tee app-test.log
      # Credentials are deliberately still in scope but unused: these drive a
      # local fixture page against a vite dev server, so they prove the shell,
      # the panels, the focus handling and the IndexedDB progress writes without
      # touching an account. Kept in this job for the browsers it has already
      # installed rather than paying for three more downloads in one of its own.
      - name: the play shell, at four laptop sizes and across two tabs
        run: |
          set -o pipefail
          npm run test:play 2>&1 | tee play-test.log
      - name: remove private test environment
        if: always()
        run: rm -f .env.local
      - name: summarize browser assertions without credentials
        if: always()
        run: node app/test/ci-summary.mjs app-test.log play-test.log
      - name: preserve sanitized failure summary
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: full-browser-failure-summary
          path: artifacts/full-browser-summary.json
          if-no-files-found: ignore
          retention-days: 3
      - if: always()
        run: rm -f app-test.log play-test.log
