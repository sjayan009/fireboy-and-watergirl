# Manual container build gate. Browser play and replay verification already run
# in full and fast respectively; this keeps the unique worker-image check.
name: worker-image
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-and-worker:
    if: github.event.repository.private == false || vars.FBWG_ZERO_DOLLAR_ACTIONS == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: build the verifier container
        run: docker build -f worker/Dockerfile -t fbwg-verifier:ci .
