# Every push and every pull request. Minutes, not tens of minutes.
#
# Everything here runs against the code alone: the simulation, the netcode over
# a simulated link, the typecheck, the build, and the checks that no secret
# reached the bundle. Anything needing a browser or a database is in full.yml,
# because a suite people stop waiting for is a suite that stops being run.
#
# ## It used to be impossible for a fork to pass
#
# The comment above said "no credentials at all" and the job contradicted it in
# two places: the build read the Supabase URL and publishable key from
# repository SECRETS, and `check.mjs` then asserted unconditionally that those
# values had reached the bundle. GitHub does not pass secrets to a workflow
# triggered by a pull request from a fork, and treats Dependabot the same way --
# so those runs built with empty values and failed a check that asked whether
# the empty values were there. Every outside contribution and every dependency
# bump arrived with a red required check nobody could turn green.
#
# So a run without credentials now says so and builds against documented
# placeholders, and the check asks the question that is actually true of the
# build in front of it: "is this configured, or is it deliberately not?".
name: fast

on:
  push:
  pull_request:
  workflow_dispatch:

# Least privilege, stated rather than inherited. Nothing here writes anything;
# the default for a repository can be far broader, and a workflow that does not
# say what it needs is one whose blast radius is a setting somewhere else.
permissions:
  contents: read

jobs:
  test:
    # Standard public runners are free. Private repos require a verified $0 stop-spend budget.
    if: github.event.repository.private == false || vars.FBWG_ZERO_DOLLAR_ACTIONS == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Pinned to a commit rather than to a tag. `@v5` is a moving reference
      # somebody else can repoint, which for an action that runs before any of
      # this repository's own code is the widest supply-chain surface a CI job
      # has. The comment is the version, so the pin can be read.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: the engine, on its own
        run: npm --prefix engine test

      # Here rather than in `full`, because it is seconds and because it is the
      # thing that decides whether a score is real. It needs no browser and no
      # database: a recorded replay, run twice in isolated realms, has to derive
      # the same medal and time both times, and every malformed or non-canonical
      # replay has to be refused. `engine test` above already built engine/dist,
      # which is what the verifier loads.
      - name: a replay verifies to the same score twice, and only that score
        run: npm run test:verifier

      # Written to the environment rather than exported, so the build and the
      # check that follows it agree about which kind of run this is.
      - name: decide whether this run has a project to talk to
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: |
          if [ -z "$SUPABASE_URL" ]; then
            echo "no Supabase project available (fork, Dependabot, or an" \
                 "unconfigured repository) -- building against placeholders"
            echo "FBWG_PLACEHOLDER_ENV=1" >> "$GITHUB_ENV"
          fi

      - name: build
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build

      - name: nothing secret in it, nothing missing from it
        run: npm run check

      # Last, because it needs the engine's declarations to exist: the rules
      # that matter here are type-aware, and a type-aware rule with no types is
      # a rule that passes everything.
      - name: and it lints
        run: npm run lint
