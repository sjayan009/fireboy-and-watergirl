# Does the thing that is actually live work?
#
# `fast` proves the code and `full` proves it in browsers, both against a
# checkout. Neither says anything about the deployment -- the CDN, the headers
# vercel.json asks for, TLS, a Content-Security-Policy that is only enforced on
# a real origin. Three releases in a row shipped with none of the headers
# applied and nothing noticed, which is what app/test/deployed.mjs was written
# for; until now it was only ever run by hand, which is another way of saying
# it was run when somebody remembered.
#
# The waiting is the interesting part. Vercel builds on its own schedule, so
# this polls /version.txt -- stamped with the commit at build time -- until the
# deployment being asked about is the one that is live. Comparing anything
# softer than a commit means passing against the PREVIOUS release when a build
# fails, which is a green check for a deployment that never happened.
name: deployed

# One at a time, and never cancel one halfway: a run that is interrupted while
# polling tells you nothing, and two runs racing would each be waiting for a
# different commit to be the live one.
#
# The group is shared with `full`, because both of them apply migrations and a
# migration runner is not a thing to have two of. `migrate.mjs` takes a
# PostgreSQL advisory lock as well -- the two are not redundant: the lock is
# what makes a manual run from a terminal safe, and this is what stops two CI
# jobs queueing behind each other for twenty minutes.
concurrency:
  group: fbwg-database
  cancel-in-progress: false

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: write the environment the test scripts read
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          # Only `migrate.mjs` needs these two, and only since the step below
          # existed. They reach the database directly rather than through the
          # API, which is why they are a different pair of secrets.
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          umask 077
          {
            echo "SUPABASE_URL=$SUPABASE_URL"
            echo "SUPABASE_PUBLISHABLE_KEY=$SUPABASE_PUBLISHABLE_KEY"
            echo "SUPABASE_SECRET_KEY=$SUPABASE_SECRET_KEY"
            echo "SUPABASE_DB_PASSWORD=$SUPABASE_DB_PASSWORD"
            echo "SUPABASE_PROJECT_REF=$SUPABASE_PROJECT_REF"
          } > .env.local

      # Before the migration, and that ordering is the point. The schema step
      # used to run first and unconditionally, so a commit whose application
      # could not even be BUILT still changed the database -- leaving forward
      # schema in front of the previous release for as long as it took somebody
      # to notice. Vercel builds the same commit from the same lockfile, so a
      # build that fails here is a build that is going to fail there.
      #
      # It does not make the two atomic. Nothing available here can: Vercel
      # deploys on its own schedule and this job cannot hold it. What it removes
      # is the case where the migration is applied for a release that was never
      # going to exist. The expand-contract rule in supabase/README.md is what
      # covers the rest.
      - name: the release builds at all
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build && npm run check

      # Then the schema. Vercel builds on push and this workflow starts on the
      # same push, so the two race: the new code can be answering on the live
      # origin before this job has applied the migration it wants. Going before
      # the wait shortens that window to nothing it can control -- and is why a
      # migration must stay compatible with the release BEFORE it. See
      # supabase/README.md.
      - name: the database is the schema the deployment expects
        run: npm run db:migrate

      - name: wait for this commit to be the one that is live
        env:
          SITE: ${{ vars.FBWG_URL || 'https://fireboy-and-watergirl-official.vercel.app' }}
        run: |
          for i in $(seq 1 60); do
            live=$(curl -fsS "$SITE/version.txt" 2>/dev/null | tr -d '[:space:]' || true)
            if [ "$live" = "$GITHUB_SHA" ]; then
              echo "live after $((i * 10))s"
              exit 0
            fi
            echo "live is '${live:-nothing}', waiting for $GITHUB_SHA"
            sleep 10
          done
          echo "::error::the deployment never became $GITHUB_SHA"
          exit 1

      - name: and does it work
        env:
          FBWG_URL: ${{ vars.FBWG_URL || 'https://fireboy-and-watergirl-official.vercel.app' }}
          FBWG_COMMIT: ${{ github.sha }}
        run: npm run test:deployed

      - name: and never leave the credentials lying about
        if: always()
        run: rm -f .env.local
